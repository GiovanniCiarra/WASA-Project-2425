openapi: 3.0.3
info:
  title: WASAText
  description: |
    WASAText is an application where users can exchange messages themselves
  version: 1.0.0

components:
  parameters:
    userId:
      schema:
        description: integer that represent a user
        type: integer
        example: 1
        readOnly: true
      name: userId
      in: path
      required: true
      description: unique identifier of a specific user

    conversationId:
      schema:
        description: integer that represent a conversation
        type: integer
        example: 1
        readOnly: true
      name: conversationId
      in: path
      required: true
      description: unique identifier of a specific conversation

    messageId:
      schema:
        description: integer that represent a message
        type: integer
        example: 1
        readOnly: true
      name: messageId
      in: path
      required: true
      description: unique identifier of a specific message

    commentId:
      schema:
        description: integer that represent a comment
        type: integer
        example: 1
        readOnly: true
      name: commentId
      in: path
      required: true
      description: unique identifier of a specific comment

  schemas:
    user:
      title: User
      description: this object represent a single user
      type: object
      properties:
        userId:
          $ref: "#/components/parameters/userId"
        username:
          description: The user's username
          type: string
          pattern: "^(?=.*[a-zA-Z0-9])[a-zA-Z0-9 ]+$"
          example: "Giovanni"
          minLength: 3
          maxLength: 16
        photo:
          description: The user's photo
          type: string
          format: byte
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAAAAAAAD..."
          minLength: 0
          maxLength: 10000000

    conversation:
      title: Conversation
      description: this object represent a single conversation (chat or group)
      type: object
      properties:
        conversationId:
          $ref: "#/components/parameters/conversationId"
        type:
          description: The type of the conversation (chat or group)
          type: string
          enum:
            - "chat"
            - "group"
          example: "group"
          minLength: 4
          maxLength: 5
        name:
          description: The group's name or other user's name
          type: string
          pattern: "^(?=.*[a-zA-Z0-9])[a-zA-Z0-9 ]+$"
          example: "gruppo calcetto"
          minLength: 3
          maxLength: 16
        photo:
          description: The group's photo or other user's photo
          type: string
          format: byte
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAAAAAAAD..."
          minLength: 0
          maxLength: 10000000
        lastMessage:
          description: most recent message in the conversation
          $ref: "#/components/schemas/message"

    message:
      title: Message
      description: this object represent a single message
      type: object
      properties:
        messageId:
          $ref: "#/components/parameters/messageId"
        conversationId:
          description: the identifier of the message's conversation
          $ref: "#/components/parameters/conversationId"
        type:
          description: the message's type (text or photo)
          type: string
          enum:
            - "text"
            - "photo"
          example: "text"
          minLength: 4
          maxLength: 5
        content:
          oneOf:
            - description: an alphanumeric string, body of the message
              type: string
              pattern: "^.*?$"
              example: "Hi, how are you?"
              minLength: 1
              maxLength: 5000
            - description: a photo, body of the message
              type: string
              format: byte
              example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAAAAAAAD..."
              minLength: 0
              maxLength: 10000000
        sender:
          description: The username of the sender
          type: string
          example: "Giovanni"
          minLength: 3
          maxLength: 16
          readOnly: true
        timestamp:
          description: the time when the message was sent
          type: string
          format: date-time
          pattern: "^.*?$"
          example: "2024-11-12T15:30:00Z"
          minLength: 20
          maxLength: 20
          readOnly: true
        status:
          description: The status of the message('sent', 'received', 'read')
          type: string
          enum:
            - "sent"
            - "received"
            - "read"
          example: "sent"
          readOnly: true
        comments:
          description: an array of the comments of the message
          type: array
          items:
            $ref: "#/components/schemas/comment"
          minItems: 0
          maxItems: 100
        isForwarded:
          description: an integer representing if the message is forwarded(0 not forwarded, 1 forwarded)
          type: integer
          minimum: 0
          maximum: 1
          example: 1

    comment:
      title: Comment
      description: this object represent a single comment
      type: object
      properties:
        commentId:
          $ref: "#/components/parameters/commentId"
        messageId:
          description: the identifier of the message's comment
          $ref: "#/components/parameters/messageId"
        content:
          description: an emoji, body of the comment
          type: string
          pattern: "^.*?$"
          example: "AgckycvkuyvVVUVYU75rr..."
          minLength: 0
          maxLength: 1398101 #(1MB)
        sender:
          description: The username of the sender
          type: string
          pattern: "^.*?$"
          example: "Giovanni"
          minLength: 3
          maxLength: 16
          readOnly: true
        timestamp:
          description: the time when the comment was sent
          type: string
          format: date-time
          pattern: "^.*?$"
          example: "2024-11-12T15:30:00Z"
          minLength: 20
          maxLength: 20
          readOnly: true

    CreateConversationRequest:
      title: Create conversation request
      type: object
      description: all the properties for the request
      properties:
        name:
          type: string
          description: The name of the group (only for groups)
          example: "Team Project"
          minLength: 3
          maxLength: 16
        photo:
          description: The photo URL of the group (only for groups)
          type: string
          format: byte
          example: "AgckycvkuyvVVUVYU75rr..."
          minLength: 0
          maxLength: 1398101 #(1MB)
        members:
          description: List of userId for group creation or single for chat
          type: array
          items:
            type: integer
          example: [3, 4, 5]
          minItems: 1
          maxItems: 49

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "there is a JWT token for authentication"

security:
  - bearerAuth: []

tags:
  - name: login
    description: operations relative to the login of the user

  - name: users
    description: operations relative to the users

  - name: chats
    description: operations relative to the chats

  - name: groups
    description: operation relative to the groups

paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Username
                  type: string
                  example: Maria
                  pattern: "^.*?$"
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        "201":
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    $ref: "#/components/parameters/userId"
        "400":
          description: Invalid Request
        "500":
          description: Internal Server Error

  /users:
    get:
      operationId: getUsers
      tags: ["users"]
      summary: "get all users"
      description: |
        Returns all the users registered
      responses:
        "200":
          description: "list of users"
          content:
            application/json:
              schema:
                description: Return an array with all the users registered
                type: array
                items:
                  $ref: "#/components/schemas/user"
                minItems: 0
                maxItems: 99999
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /users/me/username:
    put:
      operationId: setMyUserName
      tags: ["users"]
      summary: "update username of an existing user"
      description: |
        Replace the property 'username' of a specific user
        with the one in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The new username
              $ref: "#/components/schemas/user/properties/username"
              required:
                - username
      responses:
        "200":
          description: "User's username is updated successfully"
          content:
            application/json:
              schema:
                description: The new username
                $ref: "#/components/schemas/user/properties/username"
        "400":
          description: "bad Request"
        "401":
          description: Unauthorized
        "500":
          description: "Internal Server Error"

  /users/me/photo:
    put:
      operationId: setMyPhoto
      tags: ["users"]
      summary: "update photo of an existing user"
      description: |
        Replace the property 'photo' of a specific user
        with the one in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The new photo
              $ref: "#/components/schemas/user/properties/photo"
              required:
                - photo
      responses:
        "200":
          description: "User's photo is updated successfully"
          content:
            application/json:
              schema:
                description: The new photo
                $ref: "#/components/schemas/user/properties/photo"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /conversations:
    get:
      operationId: getMyConversations
      tags: ["chats"]
      summary: get the conversations of the user
      description: Return all the non-empty chats of the user
      responses:
        "200":
          description: list of chats
          content:
            application/json:
              schema:
                description: an array containing all the chats of the user
                type: array
                items:
                  $ref: "#/components/schemas/conversation"
                minItems: 0
                maxItems: 99999
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

    post:
      summary: Create a new conversation (private chat or group)
      description: Creates a new conversation. If len(members) > 1 a group conversation is created.
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created successfully
          content:
            application/json:
              schema:
                description: The Id of the newly created conversation
                $ref: "#/components/parameters/conversationId"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

  /conversations/{conversationID}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      operationId: getConversation
      tags: ["chats"]
      summary: get a specific conversation
      description: |
        Return a specific conversation of the user with all the messages
      responses:
        "200":
          description: return the list of the messages of a specific conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/message"
                minItems: 0
                maxItems: 9999
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /conversations/{conversationID}/messages:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    post:
      operationId: sendMessage
      tags: ["chats"]
      summary: create and send a message
      description: |
        a new message is created and added in the 
        message's array of a specific chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                content:
                  description: the content of the message
                  $ref: "#/components/schemas/message/properties/content"
                type:
                  description: the type of the message
                  $ref: "#/components/schemas/message/properties/type"
      responses:
        "201":
          description: The message is created and is sent succesfully
          content:
            application/json:
              schema:
                description: the message just created
                $ref: "#/components/schemas/message"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error

  /conversations/{conversationId}/messages/{messageID}/forward:
    parameters:
      - $ref: "#/components/parameters/conversationId"
      - $ref: "#/components/parameters/messageId"
    post:
      operationId: forwardMessage
      tags: ["chats"]
      summary: forward a message
      description: |
        forward an existing message to another chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: conversationId
              type: object
              properties:
                TargetChatId:
                  description: |
                    The identifier of the Chat where 
                    message has to be forwarded
                  type: integer
                  example: 1
              required:
                - TargetChatId
      responses:
        "201":
          description: the message is forwarded succesfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "400":
          description: invalid request
        "404":
          description: chat or original message not found

  /conversations/{conversationId}/messages/{messageID}:
    delete:
      operationId: deleteMessage
      tags: ["chats"]
      summary: delete a message
      description: |
        delete a message from a chat
      responses:
        "204":
          description: The message is deleted succesfully
        "404":
          description: message not found

  /messages/{messageID}/comments:
    parameters:
      - $ref: "#/components/parameters/messageID"
    post:
      operationId: commentMessage
      tags: ["chats"]
      summary: "add a comment"
      description: |
        a comment (emoji) is created and added to a specific message's comments array
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: an emoji
              type: object
              properties:
                content:
                  description: "the comment of the message (emoji)"
                  type: string
                  pattern: "^.*?$"
                  example: "\u2764\uFE0F"
                  minLength: 1
                  maxLength: 100
              required:
                - content
      responses:
        "201":
          description: |
            A comment is created and added to a specific message
            content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "400":
          description: invalid input
        "404":
          description: message not found

    delete:
      operationId: uncommentMessage
      tags: ["chats"]
      summary: uncomment a message
      description: the comment is deleted from the message's comments array
      responses:
        "200":
          description: The comment is deleted from the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "404":
          description: message, chat or comment not found

  /conversations/{conversationID}/add:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    post:
      operationId: addToGroup
      tags: ["groups"]
      summary: add to group
      description: |
        a new user is added to the specific group's members array
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The identifier of the new member
              type: integer
              example: 1
              readOnly: true
      responses:
        "204":
          description: "user added succesfully"
        "404":
          description: "group not found"

  /conversations/{conversationID}/members:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      operationId: getConversationMembers
      tags: ["groups"]
      summary: get conversation's members
      description: |
        return all the conversation's members
      responses:
        "200":
          description: return all the conversation's members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/user"
                minItems: 0
                maxItems: 99999
        "500":
          description: "Internal Server Error"

  /conversations/{conversationID}/leave:
    parameters:
      - $ref: "#/components/parameters/conversationID"
    delete:
      operationId: leaveGroup
      tags: ["groups"]
      summary: leave the group
      description: |
        the user is deleted from the group and, if the group is empty, it is deleted too
      responses:
        "204":
          description: "user deleted succesfully"
        "404":
          description: "group not found"

  /conversations/{conversationID}/name:
    parameters:
      - $ref: "#/components/parameters/groupID"
    put:
      operationId: setGroupName
      tags: ["groups"]
      summary: set the name of the group
      description: |
        The name of the specific group is setted with the 
        string passed in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: object representing a group's name
              type: object
              properties:
                name:
                  description: "new group's name"
                  type: string
                  pattern: "^.*?$"
                  example: "Wasa 24/25"
                  minLength: 1
                  maxLength: 16
              required:
                - name
      responses:
        "200":
          description: "group's name updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/conversation"
        "400":
          description: "invalid input"
        "404":
          description: "group not found"

  /conversations/{conversationID}/photo:
    parameters:
      - $ref: "#/components/parameters/groupID"
    put:
      operationId: setGroupPhoto
      tags: ["groups"]
      summary: set/change the group's photo
      description: |
        The photo of the specific group is setted/changed with the one
        passed in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: object representing a group photo (url)
              type: object
              properties:
                photo:
                  description: new group's photo
                  type: string
                  format: url
                  pattern: '^(https?|ftp):\/\/[^\s/$.?#].[^\s]*$'
                  example: "https://example.com/images/photo.jpg"
                  minLength: 0
                  maxLength: 99
              required:
                - photo
      responses:
        "200":
          description: group's photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/conversation"
        "404":
          description: group not found
