openapi: 3.0.3
info:
  title: WASAText
  description: |
    WASAText is an application where users can exchange messages themselves
  version: 1.0.0

components:
  parameters:
    userID:
      schema:
        description: integer that represent a user
        type: integer
        example: 1
        readOnly: true
      name: userID
      in: path
      required: true
      description: unique identifier of a specific user
    
    chatID:
      schema:
        description: integer that represent a chat
        type: integer
        example: 1
        readOnly: true
      name: chatID
      in: path
      required: true
      description: unique identifier of a specific chat
    
    messageID:
      schema:
        description: integer that represent a message
        type: integer
        example: 1
        readOnly: true
      name: messageID
      in: path
      required: true
      description: unique identifier of a specific message
    
    commentID:
      schema:
        description: integer that represent a comment
        type: integer
        example: 1
        readOnly: true
      name: commentID
      in: path
      required: true
      description: unique identifier of a specific comment
    
    groupID:
      schema:
        description: integer that represent a group
        type: integer
        example: 1
        readOnly: true
      name: groupID
      in: path
      required: true
      description: unique identifier of a specific group
      
      
  schemas:
    user:
      title: User
      description: this object represent a single user
      type: object
      properties:
        id: 
          description: The identifier of the user
          type: integer
          example: 1
          readOnly: true
        username:
          description: The username of the user
          type: string
          pattern: '^.*?$'
          example: "Giovanni"
          minLength: 3
          maxLength: 16
        photo:
          description: The URL of the user's photo
          type: string
          format: url
          pattern: '^(https?|ftp):\/\/[^\s/$.?#].[^\s]*$'
          example: "https://example.com/images/photo.jpg"
          minLength: 0
          maxLength: 99
    
    chat:
      title: Chat
      description: this object represent a single chat
      type: object
      properties:
        id: 
          description: The identifier of the chat
          type: integer
          example: 1
          readOnly: true
        messages:
          description: messages of the chat
          type: array
          items:
            $ref: "#/components/schemas/message"
          minItems: 1
          maxItems: 999999
      
    message:
      title: Message
      description: this object represent a single message
      type: object
      properties:
        id: 
          description: the identifier of the message
          type: integer
          example: 1
          readOnly: true
        body:
          oneOf:  
            - description: an alphanumeric string, body of the message
              type: string
              pattern: '^.*?$'
              example: "Hi, how are you?"
              minLength: 1
              maxLength: 999
            - description: a photo, body of the message
              type: string
              format: binary
              pattern: '^.*?$'
              example: "001010101010000101010"
              minLength: 0
              maxLength: 9999
        senderID: 
          description: The identifier of the sender user
          type: integer
          example: 1
        comments:
          description: a list of message's reactions (emoji)
          type: array
          items:
            type: string
            pattern: '^.*?$'
            example: "😊"
            minLength: 1
            maxLength: 100
          minItems: 0
          maxItems: 99
        timestamp:
          description: the time when the message was sent
          type: string
          format: date-time
          pattern: '^.*?$'
          example: "2024-11-12T15:30:00Z"
          minLength: 20
          maxLength: 20
          
    group:
      title: Group
      description: this object represent a single group
      type: object
      properties:
        id: 
          description: the identifier of the group
          type: integer
          example: 1
          readOnly: true
        photo:
          description: The URL of the group's photo
          type: string
          format: url
          pattern: '^(https?|ftp):\/\/[^\s/$.?#].[^\s]*$'
          example: "https://example.com/images/photo.jpg"
          minLength: 0
          maxLength: 99
        users:
          description: the list of the users in the group
          type: array
          items:
            $ref: "#/components/schemas/user"
          minItems: 3
          maxItems: 100
        messages:
          description: the list of the group's messages
          type: array
          items: 
            $ref: "#/components/schemas/message"
          minItems: 1
          maxItems: 9999
    
  securitySchemes:
    bearerAuth: 
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "there is a JWT token for authentication"

security:
  - bearerAuth: []

tags:
  - name: login
    description: operations relative to the login of the user
    
  - name: users
    description: operations relative to the users
  
  - name: chats
    description: operations relative to the chats
    
  - name: groups
    description: operation relative to the groups
  
paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    # change here if you decide to use an integer
                    # or any other type of identifier
                    type: string
                    example: "abcdef012345"
  
  /users/:
    get:
      operationId: getUsers
      tags: ["users"]
      summary: "get all users"
      description: |
        Returns all the users registered
      responses:
        "200":
          description: "list of users"
          content:
            application/json:
              schema:
                description: Return an array with all the users registered
                type: array
                items: 
                  $ref: "#/components/schemas/user"
                minItems: 0
                maxItems: 99999
    
    
  /users/{userID}/username:
    parameters:
      - $ref: "#/components/parameters/userID"
    put:
      operationId: setMyUserName
      tags: ["users"]
      summary: "update username of an existing user"
      description: |
        Replace the property 'username' of a specific user
        with the one in the requestBody
      requestBody:
        required: true
        content: 
          application/json:
            schema: 
              description: an object with the new username
              type: object
              properties:
                username: 
                  description: The new username
                  type: string
                  pattern: '^.*?$'
                  example: "Giovanni02"
                  minLength: 3
                  maxLength: 16
              required:
                - username
      responses:
        "200":
          description: "User's username is updated successfully"
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        "400":
          description: "invalid input"
        "404":
          description: "user not found"
          
          
  /users/{userID}/photo:
    parameters:
      - $ref: "#/components/parameters/userID"
    put:
      operationId: setMyPhoto
      tags: ["users"]
      summary: "update photo of an existing user"
      description: |
        Replace the property 'photo' of a specific user
        with the one in the requestBody
      requestBody:
        required: true
        content: 
          application/json:
            schema: 
              description: An object with the new photo
              type: object
              properties:
                photo:
                  description: the new photo's url
                  type: string
                  format: url
                  pattern: '^(https?|ftp):\/\/[^\s/$.?#].[^\s]*$'
                  example: "https://example.com/images/photo.jpg"
                  minLength: 0
                  maxLength: 99
      responses:
        "200":
          description: "User's photo is updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        "400":
          description: "invalid input"
        "404":
          description: "user not found"
    
    
  /chats/:
    get:
      operationId: getMyConversations
      tags: ["chats"]
      summary: get the conversations of the user
      description: |
        Return all the non-empty chats of the user
      responses:
        "200":
          description: list of chats
          content:
            application/json:
              schema:
                description: an array containing the all the chats of the user
                type: array
                items:
                  $ref: "#/components/schemas/chat"
                minItems: 0
                maxItems: 99999
                  
          
  /chats/{chatID}:
    parameters:
      - $ref: "#/components/parameters/chatID"
    get:
      operationId: getConversation
      tags: ["chats"]
      summary: get a specific chat
      description: |
        Return a specific chat of the user
      responses:
        "200":
          description: return a specific chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/chat"
                
                
  /chats/{chatID}/messages:
    parameters:
      - $ref: "#/components/parameters/chatID"
    post:
      operationId: sendMessage
      tags: ["chats"]
      summary: create and send a message
      description: |
        a new message is created and added in the 
        message's array of a specific chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/message"
      responses:
        "201":
          description: The message is created and is sent succesfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "404":
          description: "user or chat not found"
  
  
  /chats/{chatID}/messages/{messageID}:
    parameters:
      - $ref: "#/components/parameters/chatID"
      - $ref: "#/components/parameters/messageID"
    post:
      operationId: forwardMessage
      tags: ["chats"]
      summary: forward a message
      description:  |
        forward an existing message to another chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: a chatId
              type: object
              properties: 
                TargetChatId:
                  description: |
                    The identifier of the Chat where 
                    message has to be forwarded
                  type: integer
                  example: 1
              required:
                - TargetChatId
      responses:
        "200":
          description: the message is forwarded succesfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "400":
          description: invalid request
        "404":
          description: chat or original message not found
    
    delete:
      operationId: deleteMessage
      tags: ["chats"]
      summary: delete a message
      description: |
        delete a message from a chat
      responses:
        "204":
          description: The message is deleted succesfully
        "404":
          description: message not found
          

  /chats/{chatID}/messages/{messageID}/comments:
    parameters:
      - $ref: "#/components/parameters/chatID"
      - $ref: "#/components/parameters/messageID"
    post:
      operationId: commentMessage
      tags: ["chats"]
      summary: "add a comment"
      description: |
        a comment (emoji) is created and added to a specific message's comments array
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: an emoji
              type: object
              properties:
                comment:
                  description: "the comment of the message (emoji)"
                  type: string
                  pattern: '^.*?$'
                  example: "😊"
                  minLength: 1
                  maxLength: 100
              required:
                - comment
      responses:
        "201":
          description: | 
            A comment is created and added to a specific message
            content
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/message"
        "400":
          description: invalid input
        "404":
          description: message not found
  
  
  /chats/{chatID}/messages/{messageID}/comments/{commentID}:
    parameters:
      - $ref: "#/components/parameters/chatID"
      - $ref: "#/components/parameters/messageID"
      - $ref: "#/components/parameters/commentID"
    delete:
      operationId: uncommentComment
      tags: ["chats"]
      summary: uncomment a message
      description: the comment is deleted from the message's comments array 
      responses:
        "200":
          description: The comment is deleted from the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "404":
          description: message, chat or comment not found
          
  
  /groups/:
    get:
      operationId: getGroups
      tags: ["groups"]
      summary: get all the groups of the user
      description: |
        Return all the non-empty group of the user
      responses:
        "200":
          description: "List of groups"
          content:
            application/json:
              schema:
                description: |
                  Return the array containing 
                  all the groups of the user
                type: array
                items:
                  $ref: "#/components/schemas/group"
                minItems: 0
                maxItems: 99999
          
                  
  /groups/{groupID}/members:
    parameters:
      - $ref: "#/components/parameters/groupID"
    post:
      operationId: addToGroup
      tags: ["groups"]
      summary: add to group
      description: |
        a new user is added to the specific group's members array
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user"
      responses:
        "204":
          description: "user added succesfully"
        "404":
          description: "group not found"
          
          
  /groups/{groupID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/groupID"
      - $ref: "#/components/parameters/userID"
    delete:
      operationId: leaveGroup
      tags: ["groups"]
      summary: leave the group
      description: |
        the user is deleted from the group's members array
      responses:
        "204":
          description: "user deleted succesfully"
        "404":
          description: "group not found"
          
  
  /groups/{groupID}/name:
    parameters:
      - $ref: "#/components/parameters/groupID"
    put:
      operationId: setGroupName
      tags: ["groups"]
      summary: set the name of the group
      description: |
        The name of the specific group is setted with the 
        string passed in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: object representing a group's name
              type: object
              properties:
                name:
                  description: "new group's name"
                  type: string
                  pattern: '^.*?$'
                  example: "Wasa 24/25"
                  minLength: 1
                  maxLength: 16
              required: 
                - name
      responses:
        "200": 
          description: "group's name updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/group"
        "400":
          description: "invalid input"
        "404":
          description: "group not found"
    
    
  /groups/{groupID}/photo:
    parameters:
      - $ref: "#/components/parameters/groupID"
    patch:
      operationId: setGroupPhoto
      tags: ["groups"]
      summary: set/change the group's photo
      description: |
        The photo of the specific group is setted/changed with the one
        passed in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: object representing a group photo (url)
              type: object
              properties:
                photo:
                  description: new group's photo
                  type: string
                  format: url
                  pattern: '^(https?|ftp):\/\/[^\s/$.?#].[^\s]*$'
                  example: "https://example.com/images/photo.jpg"
                  minLength: 0
                  maxLength: 99
              required:   
                - photo
      responses:
        "200":
          description: group's photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/group"
        "404":
          description: group not found


  
  
