openapi: 3.0.3
info:
  title: WASAText
  description: |
    WASAText is an application where users can exchanges messages themselves
  version: 1.0.0

components:
  parameters:
    userID:
      schema:
        type: integer
        example: 1
        readOnly: true
      name: userID
      in: path
      required: true
      description: identifier of a specific user
    
    chatID:
      schema:
        type: integer
        example: 1
        readOnly: true
      name: chatID
      in: path
      required: true
      description: identifier of a specific chat
    
    messageID:
      schema:
        type: integer
        example: 1
        readOnly: true
      name: messageID
      in: path
      required: true
      description: identifier of a specific message
    
    groupID:
      schema:
        type: integer
        example: 1
        readOnly: true
      name: groupID
      in: path
      required: true
      description: identifier of a specific group
      
      
  schemas:
    user:
      title: User
      description: this object represent a single user
      type: object
      properties:
        id: 
          description: The identifier of the user
          type: integer
          example: 1
          readOnly: true
        username:
          description: The username of the user
          type: string
          example: "Giovanni"
          minLength: 3
          maxLength: 16
        photo:
          description: The photo of the user
          type: string
          format: url
          example: "https://example.com/images/photo.jpg"
    
    chat:
      title: Chat
      description: this object represent a single chat
      type: object
      properties:
        id: 
          description: The identifier of the chat
          type: integer
          example: 1
          readOnly: true
        messages:
          description: messages of the chat
          type: array
          items:
            $ref: "#/components/schemas/message"
          minItems: 1
      
    message:
      title: Message
      description: this object represent a single message
      type: object
      properties:
        id: 
          description: the identifier of the message
          type: integer
          example: 1
          readOnly: true
        body:
          description: the body of the message
          type: string
          example: "Hi, how are you?"
        sender: 
          $ref: "#/components/schemas/user"
        comment:
          description: a comment of the message
          type: string
          example: "good"
        timestamp:
          type: string
          format: date-time
          description: the time when the message was sent
          
    group:
      title: Group
      description: this object represent a single group
      type: object
      properties:
        id: 
          description: the identifier of the group
          type: integer
          example: 1
          readOnly: true
        photo:
          description: the photo of the group
          type: string
          format: url
          example: "https://example.com/images/photo.jpg"
        users:
          description: the list of the users in the group
          type: array
          items:
            $ref: "#/components/schemas/user"
        messages:
          description: the list of the group's messages
          type: array
          items: 
            $ref: "#/components/schemas/message"
  
paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: 'ˆ.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    # change here if you decide to use an integer
                    # or any other type of identifier
                    type: string
                    example: "abcdef012345"
  
  /users/:
    get:
      operationId: getUsers
      tags: ["users"]
      summary: "get all users"
      description: |
        Returns all the users registered
      responses:
        "200":
          description: "list of users"
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: "#/components/schemas/user"
                minItems: 0
                maxItems: 99999
    
    
  /users/{userID}/username:
    parameters:
      - $ref: "#/components/parameters/userID"
    put:
      operationId: setMyUsername
      tags: ["users"]
      summary: "update username of an existing user"
      description: |
        Replace the property 'username' of a specific user
        with the one in the requestBody
      requestBody:
        required: true
        content: 
          application/json:
            schema: 
              type: object
              properties:
                username: 
                  type: string
                  pattern: "^[a-zA-Z0-9]+$"
                  minLength: 3
                  maxLength: 16
              required:
                - username
      responses:
        "200":
          description: "User's username is updated successfully"
        "400":
          description: "invalid input"
        "404":
          description: "user not found"
          
          
  /users/{userID}/photo:
    parameters:
      - $ref: "#/components/parameters/userID"
    put:
      operationId: setMyPhoto
      tags: ["users"]
      summary: "update photo of an existing user"
      description: |
        Replace the property 'photo' of a specific user
        with the one in the requestBody
      requestBody:
        required: true
        content: 
          application/json:
            schema: 
              type: object
              properties:
                photo:
                  type: string
                  format: url
                  example: "https://example.com/images/photo.jpg"
      responses:
        "200":
          description: "User's photo is updated successfully"
        "400":
          description: "invalid input"
        "404":
          description: "user not found"
    
    
  /chats/:
    get:
      operationId: getMyConversations
      tags: ["chats"]
      summary: get the conversations of the user
      description: |
        Return all the non-empty chats of the user
      responses:
        "200":
          description: list of chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/chat"
                minItems: 0
                maxItems: 99999
                  
          
  /chats/{chatID}:
    parameters:
      - $ref: "#/components/parameters/chatID"
    get:
      operationId: getConversation
      tags: ["chats"]
      summary: get a specific chat
      description: |
        Return a specific chat of the user
      responses:
        "200":
          description: return a specific chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/chat"
                
                
  /chats/{chatID}/messages:
    parameters:
      - $ref: "#/components/parameters/chatID"
    post:
      operationId: sendMessage
      tags: ["chats"]
      summary: create and send a message
      description: |
        a new message is created and added in the 
        message's array of a specific chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  description: the body of the message
                  type: string
                  example: "Hi, how are you?"  
              required:
                - body
      responses:
        "201":
          description: The message is created and is sent succesfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "404":
          description: "user or chat not found"


  /chats/{chatID}/messages/{messageID}/comment:
    parameters:
      - $ref: "#/components/parameters/chatID"
      - $ref: "#/components/parameters/messageID"
    put:
      operationId: commentMessage
      tags: ["chats"]
      summary: "add a comment"
      description: |
        a comment is added to a specific message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  description: "the comment of the message"
                  type: string
                  example: "good"
              required:
                - comment
      responses:
        "201":
          description: | 
            A comment is created and added to a specific message
            content
        "400":
          description: invalid input
        "404":
          description: message not found
          
    delete:
      operationId: deleteComment
      tags: ["chats"]
      summary: uncomment a message
      description: |
        the comment, if present, is deleted from 
        the message otherwise nothing happens
      responses:
        "200":
          description: The comment is deleted from the message
        "404":
          description: message not found
          
                  
  /groups/{groupID}/users:
    parameters:
      - $ref: "#/components/parameters/groupID"
    post:
      operationId: addToGroup
      tags: ["groups"]
      summary: add to group
      description: |
        a new user is added to the specific group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user"
      responses:
        "200":
          description: "user added succesfully"
        "404":
          description: "group not found"
          
          
  /groups/{groupID}/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/groupID"
      - $ref: "#/components/parameters/userID"
    delete:
      operationId: leaveGroup
      tags: ["groups"]
      summary: leave the group
      description: |
        the user is deleted from the group's users
      responses:
        "200":
          description: "user deleted succesfully"
        "404":
          description: "group not found"
          
  
  /groups/{groupID}/name:
    parameters:
      - $ref: "#/components/parameters/groupID"
    put:
      operationId: setGroupName
      tags: ["groups"]
      summary: set the name of the group
      description: |
        The name of the specific group is setted with the 
        string passed in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: "new group's name"
                  type: string
                  example: "Wasa 24/25"
                  minLength: 1
                  maxLength: 16
              required: 
                - name
      responses:
        "200": 
          description: "group's name updated"
        "400":
          description: "invalid input"
        "404":
          description: "group not found"
    
    
  /groups/{groupID}/photo:
    parameters:
      - $ref: "#/components/parameters/groupID"
    patch:
      operationId: setGroupPhoto
      tags: ["groups"]
      summary: set/change the group's photo
      description: |
        The photo of the specific group is setted/changed with the one
        passed in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photo:
                  description: new group's photo
                  type: string
                  format: url
                  example: "https://example.com/images/photo.jpg"
              required:   
                - photo
      responses:
        "200":
          description: group's photo updated
        "404":
          description: group not found
                  
                  

  

  
  
