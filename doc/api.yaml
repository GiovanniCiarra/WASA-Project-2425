openapi: 3.0.3
info:
  title: WASAText
  description: |
    WASAText is an application where users can exchange messages themselves
  version: 1.0.0

components:
  parameters:
    userId:
      schema:
        description: integer that represent a user
        type: integer
        example: 1
        readOnly: true
      name: userId
      in: path
      required: true
      description: unique identifier of a specific user

    conversationId:
      schema:
        description: integer that represent a conversation
        type: integer
        example: 1
        readOnly: true
      name: conversationId
      in: path
      required: true
      description: unique identifier of a specific conversation

    messageId:
      schema:
        description: integer that represent a message
        type: integer
        example: 1
        readOnly: true
      name: messageId
      in: path
      required: true
      description: unique identifier of a specific message

  schemas:
    user:
      title: User
      description: this object represent a single user
      type: object
      properties:
        userId:
          description: The identifier of the user
          type: integer
          example: 1
          readOnly: true
        username:
          description: The user's username
          type: string
          pattern: "^(?=.*[a-zA-Z0-9])[a-zA-Z0-9 ]+$"
          example: "Giovanni"
          minLength: 3
          maxLength: 16
        photo:
          description: the user's photo, a Base64-encoded PNG image (data URI format)
          type: string
          pattern: "^data:image/png;base64,[A-Za-z0-9+/=]+$"
          example: "data:image/png;base64,aGVsbG8="
          minLength: 30 # Escludo stringhe troppo corte
          maxLength: 700000 # ~500 KB

    conversation:
      title: Conversation
      description: this object represent a single conversation (chat or group)
      type: object
      properties:
        conversationId:
          description: The identifier of the conversation
          type: integer
          example: 1
          readOnly: true
        type:
          description: The type of the conversation (chat or group)
          type: string
          enum:
            - "chat"
            - "group"
          example: "group"
          minLength: 4
          maxLength: 5
        name:
          description: The conversation's name
          type: string
          pattern: "^(?=.*[a-zA-Z0-9])[a-zA-Z0-9 ]+$"
          example: "gruppo calcetto"
          minLength: 3
          maxLength: 16
        photo:
          description: the comversation's photo, a Base64-encoded PNG image (data URI format)
          type: string
          pattern: "^data:image/png;base64,[A-Za-z0-9+/=]+$"
          example: "data:image/png;base64,aGVsbG8="
          minLength: 30 # Escludo stringhe troppo corte
          maxLength: 700000 # ~500 KB
        lastMessage:
          $ref: "#/components/schemas/message"

    message:
      title: Message
      description: this object represent a single message
      type: object
      properties:
        messageId:
          description: The identifier of the message
          type: integer
          example: 1
          readOnly: true
        conversationId:
          description: the identifier of the message's conversation
          type: integer
          example: 1
          readOnly: true
        type:
          description: the message's type (text or photo)
          type: string
          enum:
            - "text"
            - "photo"
          example: "text"
          minLength: 4
          maxLength: 5
        content:
          oneOf:
            - description: an alphanumeric string, body of the message
              type: string
              pattern: "^.*?$"
              example: "Hi, how are you?"
              minLength: 1
              maxLength: 200
            - description: a Base64-encoded PNG image (data URI format), body of the message
              type: string
              pattern: "^data:image/png;base64,[A-Za-z0-9+/=]+$"
              example: "data:image/png;base64,aGVsbG8="
              minLength: 30 # Escludo stringhe troppo corte
              maxLength: 700000 # ~500 KB
        senderId:
          description: The identifier of the sender user
          type: integer
          example: 1
          readOnly: true
        senderUsername:
          description: The username of the sender
          type: string
          pattern: "^.*?$"
          example: "Giovanni"
          minLength: 3
          maxLength: 16
          readOnly: true
        timestamp:
          description: the time when the message was sent
          type: string
          format: date-time
          pattern: "^.*?$"
          example: "2024-11-12T15:30:00Z"
          minLength: 20
          maxLength: 20
          readOnly: true
        status:
          description: The status of the message('sent', 'received', 'read')
          type: string
          enum:
            - "sent"
            - "received"
            - "read"
          example: "sent"
          readOnly: true
        comments:
          description: an array of the comments of the message
          type: array
          items:
            $ref: "#/components/schemas/comment"
          minItems: 0
          maxItems: 100
        isForwarded:
          description: an integer representing if the message is forwarded(0 not forwarded, 1 forwarded)
          type: integer
          minimum: 0
          maximum: 1
          example: 1

    comment:
      title: Comment
      description: this object represent a single comment
      type: object
      properties:
        commentId:
          description: The identifier of the comment
          type: integer
          example: 1
          readOnly: true
        messageId:
          description: the identifier of the message's comment
          type: integer
          example: 1
          readOnly: true
        content:
          description: an emoji, body of the comment
          type: string
          pattern: "^.*?$"
          example: "AgckycvkuyvVVUVYU75rr..."
          minLength: 0
          maxLength: 1000 #(1MB)
        sender:
          description: The username of the sender
          type: string
          pattern: "^.*?$"
          example: "Giovanni"
          minLength: 3
          maxLength: 16
          readOnly: true
        timestamp:
          description: the time when the comment was sent
          type: string
          format: date-time
          pattern: "^.*?$"
          example: "2024-11-12T15:30:00Z"
          minLength: 20
          maxLength: 20
          readOnly: true

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "there is a JWT token for authentication"

security:
  - bearerAuth: []

tags:
  - name: login
    description: operations relative to the login of the user

  - name: users
    description: operations relative to the users

  - name: chats
    description: operations relative to the chats

  - name: groups
    description: operation relative to the groups

paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              description: requestBody properties
              type: object
              properties:
                name:
                  description: Username
                  type: string
                  example: Maria
                  pattern: "^(?=.*[a-zA-Z0-9])[a-zA-Z0-9 ]+$"
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        "200":
          description: User log-in action successful
          content:
            application/json:
              schema:
                description: userId
                type: object
                properties:
                  identifier:
                    $ref: "#/components/schemas/user/properties/userId"
        "201":
          description: User creation and log-in action successful
          content:
            application/json:
              schema:
                description: userId
                type: object
                properties:
                  identifier:
                    $ref: "#/components/schemas/user/properties/userId"
        "400":
          description: Invalid Request
        "500":
          description: Internal Server Error

  /profile:
    get:
      operationId: getUserProfile
      tags: ["users"]
      summary: "get user's profile information"
      description: |
        Returns all the users information
      responses:
        "200":
          description: "userId, username, photo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /users:
    get:
      operationId: getUsers
      tags: ["users"]
      summary: "get all users"
      description: |
        Returns all the users registered
      responses:
        "200":
          description: "list of users"
          content:
            application/json:
              schema:
                description: Return an array with all the users registered
                type: array
                items:
                  $ref: "#/components/schemas/user"
                minItems: 0
                maxItems: 99
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /profile/username:
    put:
      operationId: setMyUserName
      tags: ["users"]
      summary: "update username of an existing user"
      description: |
        Replace the property 'username' of a specific user
        with the one in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The new username
              properties:
                username:
                  $ref: "#/components/schemas/user/properties/username"
              required:
                - username
      responses:
        "204":
          description: "User's username is updated successfully (No Content)"
        "400":
          description: "bad Request"
        "401":
          description: Unauthorized
        "500":
          description: "Internal Server Error"

  /profile/photo:
    put:
      operationId: setMyPhoto
      tags: ["users"]
      summary: "update photo of the authenticated user"
      description: |
        Replace the property 'photo' of the authenticated user
        with the one in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The new photo
              properties:
                photo:
                  $ref: "#/components/schemas/user/properties/photo"
              required:
                - photo
      responses:
        "204":
          description: "User's photo is updated successfully (No Content)"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /conversations:
    get:
      operationId: getMyConversations
      tags: ["chats"]
      summary: get the conversations of the user
      description: Returns all conversations (private and group) where the user has at least one message
      responses:
        "200":
          description: list of chats
          content:
            application/json:
              schema:
                description: an array containing all the chats of the user
                type: array
                items:
                  $ref: "#/components/schemas/conversation"
                minItems: 0
                maxItems: 99
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /conversations/create:
    post:
      operationId: createConversation
      tags: ["chats"]
      summary: Create a new conversation (private chat or group)
      description: Creates a new conversation. If len(members) > 1 a group conversation is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: all the properties for the request
              properties:
                name:
                  type: string
                  description: The name of the group (only for groups)
                  pattern: "^.*?$"
                  example: "Team Project"
                  minLength: 3
                  maxLength: 16
                photo:
                  description: Base64-encoded PNG image (data URI format), only for groups
                  type: string
                  pattern: "^data:image/png;base64,[A-Za-z0-9+/=]+$"
                  example: "data:image/png;base64,aGVsbG8="
                  minLength: 30 # Escludo stringhe troppo corte
                  maxLength: 700000 # ~500 KB
                members:
                  description: List of userId for group creation or single for chat
                  type: array
                  items:
                    type: integer
                  example: [3, 4, 5]
                  minItems: 1
                  maxItems: 49
      responses:
        "201":
          description: Conversation created successfully
          content:
            application/json:
              schema:
                type: object
                description: conversationId
                properties:
                  conversationId:
                    $ref: "#/components/schemas/conversation/properties/conversationId"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

  /privateChat/{userId}:
    parameters:
      - $ref: "#/components/parameters/userId"
    get:
      operationId: getConversationByUserId
      tags: ["chats"]
      summary: get a specific private conversation by userId
      description: |
        Return a specific private conversation of the user with the userId in the path
      responses:
        "200":
          description: return the conversationId of the conversation with the user in the path
          content:
            application/json:
              schema:
                type: object
                description: conversationId
                properties:
                  conversationId:
                    $ref: "#/components/schemas/conversation/properties/conversationId"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error

  /conversation-info/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      operationId: getConversation
      tags: ["chats"]
      summary: get a specific conversation
      description: |
        Returns all messages exchanged in the specified conversation (text or photo, with metadata)
      responses:
        "200":
          description: return the list of the messages of a specific conversation
          content:
            application/json:
              schema:
                description: message's array
                type: array
                items:
                  $ref: "#/components/schemas/message"
                minItems: 0
                maxItems: 99
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /conversation-delete/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    delete:
      operationId: deleteConversation
      tags: ["chats"]
      summary: delete a specific conversation
      description: |
        delete the specified conversation of the user with all the messages
      responses:
        "204":
          description: the conversation is deleted successfully
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /conversation-messages/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    post:
      operationId: sendMessage
      tags: ["chats"]
      summary: create and send a message
      description: |
        a new message is created and added in the 
        message's array of a specific chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the content and the type of the message
              type: object
              properties:
                content:
                  $ref: "#/components/schemas/message/properties/content"
                type:
                  $ref: "#/components/schemas/message/properties/type"
      responses:
        "201":
          description: The message is created and is sent succesfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error

  /messages/{messageId}/forwards:
    parameters:
      - $ref: "#/components/parameters/messageId"
    post:
      operationId: forwardMessage
      tags: ["chats"]
      summary: forward a message
      description: |
        forward an existing message to another chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: conversationId of the conversation where the message will be forwarded
              type: object
              properties:
                targetChatId:
                  $ref: "#/components/schemas/conversation/properties/conversationId"
              required:
                - targetChatId
      responses:
        "201":
          description: the message is forwarded succesfully and a new message is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: internal Server Error

  /messages/{messageId}/replies:
    parameters:
      - $ref: "#/components/parameters/messageId"
    post:
      operationId: replyMessage
      tags: ["chats"]
      summary: reply to a message
      description: |
        reply to an existing message in the same conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the content and the type of the new message
              type: object
              properties:
                content:
                  $ref: "#/components/schemas/message/properties/content"
                type:
                  $ref: "#/components/schemas/message/properties/type"
      responses:
        "201":
          description: the message is replied succesfully and a new message is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: internal Server Error

  /conversations/{conversationId}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
      - $ref: "#/components/parameters/messageId"
    delete:
      operationId: deleteMessage
      tags: ["chats"]
      summary: delete a message
      description: |
        Deletes a message sent by the user. If it was the last message in the conversation, the conversation is also deleted.
      responses:
        "204":
          description: The message is deleted succesfully
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: internal Server Error

  /messages/{messageId}/comments:
    parameters:
      - $ref: "#/components/parameters/messageId"
    post:
      operationId: commentMessage
      tags: ["chats"]
      summary: "add a comment"
      description: |
        a comment (emoji) is created and added to a specific message's comments array
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: an emoji
              type: object
              properties:
                content:
                  description: "the comment of the message (emoji)"
                  type: string
                  pattern: "^.*?$"
                  example: "\u2764\uFE0F"
                  minLength: 1
                  maxLength: 100
              required:
                - content
      responses:
        "201":
          description: A comment is created and added to a specific message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/comment"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Conflict - The user has already commented on the message
        "500":
          description: internal Server Error

    delete:
      operationId: uncommentMessage
      tags: ["chats"]
      summary: uncomment a message
      description: the comment is deleted from the message's comments array
      responses:
        "204":
          description: The comment is deleted from the message
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: internal Server Error

  /conversation-members/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    get:
      operationId: getConversationMembers
      tags: ["groups"]
      summary: get conversation's members
      description: |
        return all the members of the conversation
      responses:
        "200":
          description: return all the members of the conversation
          content:
            application/json:
              schema:
                description: conversation member's array
                type: array
                items:
                  $ref: "#/components/schemas/user"
                minItems: 0
                maxItems: 50
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: internal Server Error

  /conversation-add/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    post:
      operationId: addToGroup
      tags: ["groups"]
      summary: add to group
      description: |
        a new user is added to the specific group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The identifier of the new member
              properties:
                userId:
                  $ref: "#/components/schemas/user/properties/userId"
              required:
                - userId
      responses:
        "204":
          description: "user added succesfully"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "500":
          description: internal Server Error

  /conversation-members/{conversationId}/me:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    delete:
      operationId: leaveGroup
      tags: ["groups"]
      summary: leave the group
      description: |
        the user is deleted from the group and, if the group is empty, it is deleted too
      responses:
        "204":
          description: user deleted successfully
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: internal Server Error

  /conversation-name/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    put:
      operationId: setGroupName
      tags: ["groups"]
      summary: set the name of the group
      description: |
        The name of the specific group is set with the 
        string passed in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: object representing a group's name
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/conversation/properties/name"
              required:
                - name
      responses:
        "204":
          description: group's name updated successfully (No Content)
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: internal Server Error

  /conversation-photo/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/conversationId"
    put:
      operationId: setGroupPhoto
      tags: ["groups"]
      summary: set/change the group's photo
      description: |
        The photo of the specific group is setted/changed with the one
        passed in the requestBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Base64-encoded PNG image in data URI format
              type: object
              properties:
                photo:
                  $ref: "#/components/schemas/conversation/properties/photo"
              required:
                - photo
      responses:
        "204":
          description: group's photo updated successfully (No Content)
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: internal Server Error
